apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: order-service

  labels:
    app: order-service

spec:

  replicas: 3

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: order-service

  template:

    metadata:
      labels:
        app: order-service

    spec:

      containers:

        - name: order-service

          image: order-service:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:

            - configMapRef:
                name: order-service-config

            - secretRef:
                name: order-service-secret

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:

            httpGet:
              path: /actuator/health/readiness
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /actuator/health/liveness
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:

            allowPrivilegeEscalation: false
            runAsNonRoot: true